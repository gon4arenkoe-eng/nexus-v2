@media(max-width:760px){.account-form,.permission-grid{grid-template-columns:1fr}.account-form .full{grid-column:auto}.account-summary{grid-template-columns:1fr 1fr}.exchange-actions{justify-content:flex-start}}

function normalizeCfg(w){
  const defaults=defaultWidgetCfg();

  const supplied=(
    w &&
    w.cfg &&
    typeof w.cfg==='object' &&
    !Array.isArray(w.cfg)
  )
    ?w.cfg
    :{};

  const cfg={
    ...defaults,
    ...supplied
  };

  for(const field of [
    'scope',
    'timeframe',
    'refresh',
    'metrics',
    'columns',
    'sort',
    'filter'
  ]){
    if(typeof cfg[field]!=='string'){
      cfg[field]=defaults[field];
    }
  }

  cfg.compact=cfg.compact===true;

  w.cfg=cfg;

  return w;
}

function fmtSigned(value,digits=2){const n=Number(value);if(!Number.isFinite(n))return '—';const text=new Intl.NumberFormat(state.lang,{maximumFractionDigits:digits}).format(Math.abs(n));return `${n>0?'+':n<0?'−':''}${text}`}
function fmtRatio(value,digits=1){const n=Number(value);return Number.isFinite(n)?`${(n*100).toFixed(digits)}%`:'—'}

function rectOverlap(a,b){return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y)}
function normalizeItem(w){w.w=Math.max(2,Math.min(12,Math.round(w.w)));w.h=Math.max(2,Math.min(12,Math.round(w.h)));w.x=Math.max(0,Math.min(12-w.w,Math.round(w.x)));w.y=Math.max(0,Math.round(w.y));return w}
function reflowLayout(layout,anchorId){layout.forEach(normalizeItem);const anchor=layout.find(w=>w.id===anchorId);const others=layout.filter(w=>w.id!==anchorId).sort((a,b)=>a.y-b.y||a.x-b.x);if(anchor){for(const w of others){let guard=0;while(rectOverlap(w,anchor)&&guard++<100)w.y=anchor.y+anchor.h}}const ordered=[...(anchor?[anchor]:[]),...others].sort((a,b)=>a.y-b.y||a.x-b.x);for(let i=0;i<ordered.length;i++){const w=ordered[i];let guard=0;while(ordered.some((o,j)=>j<i&&rectOverlap(w,o))&&guard++<100){const hits=ordered.filter((o,j)=>j<i&&rectOverlap(w,o));w.y=Math.max(...hits.map(o=>o.y+o.h))}}return layout}
function compactLayout(layout){const ordered=layout.slice().sort((a,b)=>a.y-b.y||a.x-b.x);for(const w of ordered){let y=w.y;while(y>0){const test={...w,y:y-1};if(ordered.some(o=>o.id!==w.id&&rectOverlap(test,o)))break;y--}w.y=y}return layout}

function addCatalogWidget(key){
  const c=widgetCatalog.find(x=>x.key===key);

  if(!c)return;

  /*
   * Browser catalog entries are only saveable when their
   * identity comes directly from the canonical Widget Registry.
   */
  if(
    typeof c.canonicalKey!=='string' ||
    !c.canonicalKey ||
    !Number.isInteger(c.canonicalVersion) ||
    c.canonicalVersion<1
  ){
    return;
  }

  pushUndo();

  const y=Math.max(
    0,
    ...state.workspace.map(w=>w.y+w.h)
  );

  const w=normalizeCfg({
    id:'w'+Date.now(),
    key:c.key,
    title:c.title,
    x:0,
    y,
    w:c.w,
    h:c.h,
    canonicalKey:c.canonicalKey,
    canonicalVersion:c.canonicalVersion,
    contextGroup:null
  });

  state.workspace.push(w);
  compactLayout(state.workspace);
  state.selectedWidget=w.id;
  state.modal=null;
  markDirty();
  render();
}

function applyResize(w,orig,dx,dy,dir){let x=orig.x,y=orig.y,ww=orig.w,hh=orig.h;if(dir.includes('e'))ww=orig.w+dx;if(dir.includes('s'))hh=orig.h+dy;if(dir.includes('w')){x=orig.x+dx;ww=orig.w-dx}if(dir.includes('n')){y=orig.y+dy;hh=orig.h-dy}if(ww<2){if(dir.includes('w'))x=orig.x+orig.w-2;ww=2}if(hh<2){if(dir.includes('n'))y=orig.y+orig.h-2;hh=2}if(x<0){if(dir.includes('w'))ww+=x;x=0}if(y<0){if(dir.includes('n'))hh+=y;y=0}if(x+ww>12){if(dir.includes('e'))ww=12-x;else x=12-ww}w.x=x;w.y=y;w.w=ww;w.h=hh;normalizeItem(w)}

 let canonicalContextSequence=0;
const contextDeliveriesByWidget={};

function activeLinkedContextGroups(){
  const groups=[
    ...new Set(
      (state.workspace?.layout||[])
        .map(
          item=>
            String(
              item?.contextGroup||''
            ).trim()
        )
        .filter(Boolean)
    )
  ];

  return groups.length
    ?groups
    :['market'];
}

function applyContextDeliveries(deliveries){
  for(const delivery of deliveries||[]){
    const widgetId=
      String(
        delivery?.widgetInstanceId||''
      );

    if(!widgetId){
      continue;
    }

    contextDeliveriesByWidget[
      widgetId
    ]={
      key:String(delivery?.key||''),
      value:String(delivery?.value||''),
      sequence:Number(
        delivery?.sequence||0
      ),
      contextGroup:String(
        delivery?.contextGroup||''
      )
    };
  }
}

async function publishCanonicalContext(
  key,
  value
){
  if(!activeServerWorkspaceId){
    return [];
  }

  const groups=
    activeLinkedContextGroups();

  const deliveries=[];

  for(const contextGroup of groups){
    canonicalContextSequence+=1;

    const response=await fetch(
      '/api/v2/control-plane/context',
      {
        method:'POST',
        credentials:'same-origin',
        cache:'no-store',
        headers:{
          'content-type':
            'application/json'
        },
        body:JSON.stringify({
          workspaceId:
            activeServerWorkspaceId,
          contextGroup,
          key,
          value:String(value),
          sequence:
            canonicalContextSequence
        })
      }
    );

    if(!response.ok){
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const payload=
      await response.json();

    deliveries.push(
      ...(payload?.deliveries||[])
    );
  }

  applyContextDeliveries(
    deliveries
  );

  return deliveries;
}

let serverWorkspaces=[];

let serverWidgetAvailability=new Map();
let widgetAvailabilityLoaded=false;

async function loadWidgetAvailability(){
  widgetAvailabilityLoaded=false;
  serverWidgetAvailability=new Map();

  const response=await fetch(
    '/api/v2/control-plane/widget-availability',
    {
      credentials:'same-origin',
      cache:'no-store'
    }
  );

  if(!response.ok){
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  const payload=await response.json();

  serverWidgetAvailability=new Map(
    (payload?.widgets||[]).map(
      item=>[
        `${String(item.key)}@${Number(item.widgetVersion||1)}`,
        item
      ]
    )
  );

  widgetAvailabilityLoaded=true;

  return payload;
}

function availableWidgetCatalog(){
  if(!widgetAvailabilityLoaded){
    return [];
  }

  return Array.prototype.filter.call(
    widgetCatalog,
    item=>{
      const key=String(
        item?.key
        ||item?.widgetKey
        ||''
      );

      const version=Number(
        item?.widgetVersion
        ||item?.version
        ||1
      );

      return (
        serverWidgetAvailability
          .get(`${key}@${version}`)
          ?.available===true
      );
    }
  );
}

    return `<option value="${esc(id)}" ${activeServerWorkspaceId===id?'selected':''}>${esc(name)}</option>`;
  }).join('');

  const placeholder=activeServerWorkspaceId
    ?''
    :`<option value="" selected disabled>? ${t('label.workspace')} ?</option>`;

  const selector=serverWorkspaces.length
    ?`<div class="context-field canonical-workspace-field"><label>${t('label.workspace')}</label><select data-canonical-workspace>${placeholder}${options}</select></div>`
    :`<div class="context-field canonical-workspace-field"><label>${t('label.workspace')}</label><span>?</span></div>`;

  const canRestore=
    Number.isInteger(activeServerWorkspaceBaseVersion) &&
    activeServerWorkspaceBaseVersion>1;

  const restoreButton=canRestore
    ?`<button class="btn secondary" type="button" data-restore-canonical-workspace>? ${t('action.restore')}</button>`
    :'';

  const templateOptions=
    serverWorkspaceTemplates.map(
      (template,index)=>
        `<option value="${index}">${esc(t(template.titleKey)||template.key)} ? v${template.version}</option>`
    ).join('');

  const templateControls=
    serverWorkspaceTemplates.length
      ?`<div class="context-field"><label>${t('workspace.new')}</label><select data-workspace-template>${templateOptions}</select></div><button class="btn secondary" type="button" data-create-template-workspace>${t('workspace.new')}</button>`
      :'';

  return `<div class="canonical-workspace-controls" style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">${selector}<button class="btn secondary" type="button" data-create-blank-workspace>${t('workspace.new')}</button>${templateControls}${restoreButton}</div>`;
}

function applyServerWorkspace(workspace){
  const baseVersion=workspace?.activeLayoutVersion;

  /*
   * Future canonical saves must be based on the exact server
   * layout version that was loaded. Never invent or default it.
   */
  if(!Number.isInteger(baseVersion) || baseVersion<1)return false;

  const projected=workspaceProjectionToLayout(workspace);

  if(!projected)return false;

  activeServerWorkspaceId=String(workspace.id);
  activeServerWorkspaceBaseVersion=baseVersion;
  state.workspace=projected;
  state.selectedWidget=null;
  state.layoutDirty=false;

  return true;
}

function applyServerWorkspaceById(workspaceId){
  const workspace=serverWorkspaces.find(
    item=>String(item?.id||'')===workspaceId
  );

  if(!workspace)return false;

  return applyServerWorkspace(workspace);
}

const renderContextBarBeforeCanonicalWorkspaces=renderContextBar;

  if(!markup.includes(divider))return markup;

  return markup.replace(
    divider,
    `${selector}${divider}`
  );
};

function workspaceProjectionToLayout(workspace){
  const raw=Array.isArray(workspace?.widgets)?workspace.widgets:[];
  const projected=[];

  for(let index=0;index<raw.length;index++){
    const item=raw[index];

    /*
     * Canonical identity and browser presentation identity are
     * deliberately separate.
     */
    const presentation=
      CANONICAL_WIDGET_PRESENTATION[item.key];

    /*
     * Never guess how to render an unknown future canonical
     * widget.
     */
    if(!presentation)return null;

    const catalog=widgetCatalog.find(
      entry=>entry.key===presentation.key
    );

    /*
     * Registry/browser presentation drift is fail-closed too.
     */
    if(!catalog)return null;

    let cfg={};

    try{
      const parsed=JSON.parse(item.settingsJson||'{}');

      if(
        parsed &&
        typeof parsed==='object' &&
        !Array.isArray(parsed)
      ){
        cfg=parsed;
      }
    }catch(error){
      /*
       * Invalid presentation settings must not destroy canonical
       * layout geometry.
       */
      cfg={};
    }

    const projectedItem=normalizeCfg({
      id:item.id||`api-widget-${index+1}`,
      key:presentation.key,
      title:presentation.title||catalog.title,
      x:Number.isInteger(item.column)?item.column:0,
      y:Number.isInteger(item.row)?item.row:0,
      w:Number.isInteger(item.width)?item.width:4,
      h:Number.isInteger(item.height)?item.height:3,
      cfg
    });

    /*
     * Context Bus membership is canonical presentation state too.
     * Preserve it exactly; malformed non-string values fail closed.
     */
    if(
      item.contextGroup!==null &&
      item.contextGroup!==undefined &&
      typeof item.contextGroup!=='string'
    ){
      return null;
    }

    projectedItem.contextGroup=item.contextGroup??null;

    /*
     * Preserve source-of-truth identity for later canonical
     * persistence. Never reconstruct it from presentation.key.
     */
    /*
     * Canonical versions are persistence identity.
     * Never invent version 1 for malformed server data.
     */
    if(
      !Number.isInteger(item.widgetVersion) ||
      item.widgetVersion<1
    ){
      return null;
    }

    projectedItem.canonicalKey=item.key;
    projectedItem.canonicalVersion=item.widgetVersion;

    projected.push(projectedItem);
  }

  return projected;
}



function canonicalWorkspaceSavePayload(){
  /*
   * This function builds canonical presentation persistence only.
   * It does not perform HTTP or database mutation.
   */
  if(
    typeof activeServerWorkspaceId!=='string' ||
    !activeServerWorkspaceId
  ){
    return null;
  }

  if(
    !Number.isInteger(activeServerWorkspaceBaseVersion) ||
    activeServerWorkspaceBaseVersion<1
  ){
    return null;
  }

  const widgets=[];

  for(const item of state.workspace){
    if(
      !item ||
      typeof item.id!=='string' ||
      !item.id
    ){
      return null;
    }

    /*
     * Never reverse-infer canonical identity from browser key.
     * Local catalog widgets without canonical identity remain
     * intentionally unsaveable until registry-backed add wiring exists.
     */
    if(
      typeof item.canonicalKey!=='string' ||
      !item.canonicalKey ||
      !Number.isInteger(item.canonicalVersion) ||
      item.canonicalVersion<1
    ){
      return null;
    }

    if(
      item.contextGroup!==null &&
      item.contextGroup!==undefined &&
      typeof item.contextGroup!=='string'
    ){
      return null;
    }

    if(
      !Number.isInteger(item.x) ||
      !Number.isInteger(item.y) ||
      !Number.isInteger(item.w) ||
      !Number.isInteger(item.h) ||
      item.x<0 ||
      item.y<0 ||
      item.w<1 ||
      item.h<1 ||
      item.x+item.w>12
    ){
      return null;
    }

    const cfg=item.cfg??{};

    if(
      !cfg ||
      typeof cfg!=='object' ||
      Array.isArray(cfg)
    ){
      return null;
    }

    let settingsJson;

    try{
      settingsJson=JSON.stringify(cfg);
    }catch(error){
      return null;
    }

    widgets.push({
      id:item.id,
      key:item.canonicalKey,
      widgetVersion:item.canonicalVersion,
      column:item.x,
      row:item.y,
      width:item.w,
      height:item.h,
      contextGroup:item.contextGroup??null,
      settingsJson
    });
  }

  return {
    workspaceId:activeServerWorkspaceId,
    baseVersion:activeServerWorkspaceBaseVersion,
    widgets
  };
}


async function createWorkspaceFromTemplate(){
  const select=document.querySelector(
    '[data-workspace-template]'
  );

  if(!select)return false;

  const index=Number(select.value);

  if(
    !Number.isInteger(index) ||
    index<0 ||
    index>=serverWorkspaceTemplates.length
  ){
    return false;
  }

  const template=
    serverWorkspaceTemplates[index];

  const translatedName=
    t(template.titleKey);

  const defaultName=
    translatedName ||
    template.key;

  const proposed=window.prompt(
    t('workspace.new'),
    defaultName
  );

  if(proposed===null)return false;

  const name=proposed.trim();

  if(!name)return false;

  const current=serverWorkspaces.find(
    item=>
      String(item?.id||'')===
      String(activeServerWorkspaceId||'')
  );

  const locale=String(
    current?.locale ||
    (state.lang==='ru'?'ru':'en')
  );

  const theme=String(
    current?.theme ||
    (state.theme==='light'?'light':'dark')
  );

  const response=await fetch(
    '/api/v2/control-plane/workspaces/from-template',
    {
      method:'POST',
      credentials:'same-origin',
      cache:'no-store',
      headers:{
        'content-type':'application/json'
      },
      body:JSON.stringify({
        name,
        locale,
        theme,
        templateKey:template.key,
        templateVersion:template.version
      })
    }
  );

  if(!response.ok){
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  const workspace=
    await response.json();

  if(
    !workspace ||
    typeof workspace!=='object' ||
    typeof workspace.id!=='string' ||
    !workspace.id ||
    !Number.isInteger(
      workspace.activeLayoutVersion
    ) ||
    workspace.activeLayoutVersion!==1 ||
    !Array.isArray(workspace.widgets)
  ){
    throw new Error(
      'canonical template workspace response invalid'
    );
  }

  serverWorkspaces.push(workspace);

  if(!applyServerWorkspace(workspace)){
    throw new Error(
      'canonical template workspace invalid'
    );
  }

  safeSet(
    'nexus:v7:workspace',
    JSON.stringify(state.workspace)
  );

  return true;
}

async function saveCanonicalWorkspace(){
  const payload=canonicalWorkspaceSavePayload();

  if(!payload){
    throw new Error(
      'canonical workspace save payload unavailable'
    );
  }

  const response=await fetch(
    '/api/v2/control-plane/workspaces/save',
    {
      method:'POST',
      credentials:'same-origin',
      cache:'no-store',
      headers:{
        'content-type':'application/json'
      },
      body:JSON.stringify(payload)
    }
  );

  if(response.status===409){
    /*
     * Loaded base version is stale.
     * Never overwrite newer canonical state.
     */
    await loadWorkspaceState();
    return false;
  }

  if(!response.ok){
    throw new Error(`HTTP ${response.status}`);
  }

  const workspace=await response.json();

  const existingIndex=
    serverWorkspaces.findIndex(
      item=>
        String(item.id)===String(workspace.id)
    );

  if(existingIndex>=0){
    serverWorkspaces[existingIndex]=workspace;
  }else{
    serverWorkspaces.push(workspace);
  }

  if(!applyServerWorkspace(workspace)){
    throw new Error(
      'canonical workspace response invalid'
    );
  }

  /*
   * localStorage is only a local mirror/fallback.
   * Canonical version comes from server response.
   */
  safeSet(
    'nexus:v7:workspace',
    JSON.stringify(state.workspace)
  );

  return true;
}

async function restoreCanonicalWorkspaceVersion(){
  if(
    !activeServerWorkspaceId ||
    !Number.isInteger(
      activeServerWorkspaceBaseVersion
    ) ||
    activeServerWorkspaceBaseVersion<=1
  ){
    return false;
  }

  const baseVersion=
    activeServerWorkspaceBaseVersion;

  const proposed=window.prompt(
    'Restore layout version',
    String(baseVersion-1)
  );

  if(proposed===null)return false;

  const targetVersion=Number(proposed);

  if(
    !Number.isInteger(targetVersion) ||
    targetVersion<1 ||
    targetVersion>=baseVersion
  ){
    return false;
  }

  const response=await fetch(
    '/api/v2/control-plane/workspaces/restore',
    {
      method:'POST',
      credentials:'same-origin',
      cache:'no-store',
      headers:{
        'content-type':'application/json'
      },
      body:JSON.stringify({
        workspaceId:activeServerWorkspaceId,
        baseVersion,
        targetVersion
      })
    }
  );

  if(response.status===409){
    await loadWorkspaceState();
    return false;
  }

  if(!response.ok){
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  const workspace=await response.json();

  const existingIndex=
    serverWorkspaces.findIndex(
      item=>
        String(item?.id||'')===
        String(workspace?.id||'')
    );

  if(existingIndex<0){
    throw new Error(
      'restored canonical workspace missing'
    );
  }

  serverWorkspaces[existingIndex]=workspace;

  if(!applyServerWorkspace(workspace)){
    throw new Error(
      'canonical restore response invalid'
    );
  }

  safeSet(
    'nexus:v7:workspace',
    JSON.stringify(state.workspace)
  );

  return true;
}

};

async function loadWorkspaceTemplates(){
  try{
    const response=await fetch(
      '/api/v2/control-plane/workspace-templates',
      {
        credentials:'same-origin',
        cache:'no-store'
      }
    );

    if(!response.ok){
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const payload=
      await response.json();

    if(!Array.isArray(payload)){
      throw new Error(
        'workspace template catalog invalid'
      );
    }

    serverWorkspaceTemplates=
      payload.filter(
        template=>
          template &&
          typeof template==='object' &&
          typeof template.key==='string' &&
          template.key &&
          Number.isInteger(
            template.version
          ) &&
          template.version>0 &&
          typeof template.titleKey==='string' &&
          template.titleKey &&
          Number.isInteger(
            template.widgetCount
          ) &&
          template.widgetCount>0
      );

  }catch(error){
    serverWorkspaceTemplates=[];
  }
}

async function loadWorkspaceState(){
  try{
    const response=await fetch(
      '/api/v2/control-plane/workspaces',
      {
        credentials:'same-origin',
        cache:'no-store'
      }
    );

    if(!response.ok){
      throw new Error(`HTTP ${response.status}`);
    }

    const payload=await response.json();

    serverWorkspaces=Array.isArray(payload)?payload:[];
    activeServerWorkspaceBaseVersion=null;

    if(serverWorkspaces.length===0){
      activeServerWorkspaceId=null;
      return;
    }

    if(serverWorkspaces.length===1){
      if(!applyServerWorkspace(serverWorkspaces[0])){
        activeServerWorkspaceId=null;
      }
      return;
    }

    /*
     * Multiple canonical workspaces require explicit user
     * selection. Never choose the first server identity
     * arbitrarily. A previously selected identity may only
     * be reapplied when it is still present in this scoped
     * canonical response.
     */
    if(activeServerWorkspaceId){
      if(!applyServerWorkspaceById(activeServerWorkspaceId)){
        activeServerWorkspaceId=null;
      }
    }
  }catch(error){
    /*
     * Read-only server projection is optional in this preview
     * composition root. Existing browser-local layout remains
     * the fallback. No server mutation is attempted.
     */
    serverWorkspaces=[];
    activeServerWorkspaceId=null;
    activeServerWorkspaceBaseVersion=null;
  }
}

async function loadOperationalState(){try{const response=await fetch('/api/v2/control-plane/overview',{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);operational=await response.json();operationalError=null}catch(error){operational=null;operationalError=error instanceof Error?error.message:rt('readError')}refreshOperationalRows();}
Promise.allSettled([loadWidgetAvailability(),loadWorkspaceTemplates(),loadWorkspaceState(),loadOperationalState()]).finally(()=>render());
