name: NEXUS V2 Release Image Foundation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version label (for example 0.12.0-rc.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: nexus-v2-release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify source before image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]" pytest flake8 mypy

      - name: Compile Python
        run: python -m compileall -q apps packages infra adapters workers scripts

      - name: Static checks
        run: |
          python -m mypy apps packages infra adapters workers --explicit-package-bases

      - name: Full regression
        run: python -m pytest -q --tb=short

      - name: Release foundation policy check
        run: python infra/github/release_pipeline_check.py

  publish:
    name: Build and publish immutable GHCR image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      immutable_ref: ${{ steps.identity.outputs.immutable_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Normalize image identity
        id: identity
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "immutable_ref=${image}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1  # pinned
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7  # pinned
        with:
          images: ${{ steps.identity.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=${{ inputs.release_version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push verified image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4  # pinned
        with:
          context: .
          file: infra/containers/Dockerfile.release
          push: true
          sbom: true
          provenance: mode=max
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXUS_COMMIT_SHA=${{ github.sha }}
            NEXUS_BUILD_VERSION=${{ inputs.release_version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify digest exists
        shell: bash
        run: |
          test -n "${{ steps.build.outputs.digest }}"
          case "${{ steps.build.outputs.digest }}" in
            sha256:*) ;;
            *) echo "Expected sha256 digest" >&2; exit 1 ;;
          esac

      - name: Publish release evidence summary
        shell: bash
        run: |
          {
            echo "## NEXUS V2 release image"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- image: \`${{ steps.identity.outputs.image }}\`"
            echo "- immutable tag: \`${{ steps.identity.outputs.immutable_ref }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Production deployment is intentionally not performed by this foundation workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
