name: NEXUS V2 CI Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexus-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify repository baseline
        run: python infra/github/repo_baseline_check.py

      - name: Verify local development baseline
        run: python scripts/dev_check.py

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]" pytest

      - name: Verify shared contract suite
        run: python -m pytest -q

      - name: Verify Git whitespace
        run: git diff --check HEAD^ HEAD
