name: NEXUS V2 CI Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexus-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify repository baseline
        run: python infra/github/repo_baseline_check.py

      - name: Verify Git whitespace
        run: git diff --check HEAD^ HEAD
