[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-v2"
version = "0.0.0"
description = "NEXUS V2 monorepo foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
]

[project.optional-dependencies]
test = [
    "aiosqlite>=0.20,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "packages*",
    "infra*",
    "adapters*",
    "workers*",
]
namespaces = true

[tool.nexus]
phase = 1
production_build_allowed = false
production_deploy_allowed = false
